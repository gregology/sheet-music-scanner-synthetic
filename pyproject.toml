[project]
name = "sheet-synth"
version = "0.1.0"
description = "Generates synthetic phone photos of sheet music with the true score of each"
requires-python = "==3.11.*"
license = "MIT"
authors = [{ name = "Greg Clarke" }]
dependencies = [
    "bpy==5.0.1",
    "cairosvg==2.8.2",
    "numpy==1.26.4",
    "opencv-python-headless==4.11.0.86",
    "pillow==12.0.0",
    "verovio==6.4.1",
]

[dependency-groups]
dev = ["music21==9.9.1", "pytest==8.4.2", "rapidfuzz==3.14.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheet_synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
